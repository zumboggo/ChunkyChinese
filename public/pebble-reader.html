actor":"Alden","emotion":"thoughtful","scene":"train"},{"type":"line","speaker":"Alden","scene":"train","phrases":[{"py":"běn lái，","en":"They were supposed to"},{"py":"tā men zhǐ shì bāng méi yǒu néng lì de rén lí kāi wēi xiǎn de dì fang，","en":"help people without powers leave dangerous places,"},{"py":"huò zhě ràng dà jiā zhī dào bié rén zài shuō shén me。","en":"or help everyone communicate."},{"py":"kě huài rén bú huì yīn wèi zhè yàng，","en":"But that wouldn’t stop villains"},{"py":"jiù bù shā tā men。","en":"from killing them."}]},{"type":"line","speaker":"Alden","scene":"train","phrases":[{"py":"néng lì méi nà me qiáng de rén，","en":"People whose powers are weaker"},{"py":"dà duō liú zài nà lǐ。","en":"mostly stay on the island."},{"py":"yǒu xiē rén ràng dà jiā kàn tā men de néng lì，","en":"Some show their abilities to audiences,"},{"py":"yòng zhè yàng de fāng fǎ zhuàn qián。","en":"earning money that way."},{"py":"hěn shǎo yǒu rén hái xiàng tā yí yàng，","en":"Few people still do what she does,"},{"py":"xuǎn de dōu shì bāng zhù bié rén de néng lì。","en":"choosing powers that help others."}]},{"type":"line","speaker":"Alden","scene":"train","phrases":[{"py":"zhè yàng xuǎn，","en":"Choosing that way"},{"py":"yí gè rén yù dào huài rén de shí hou，","en":"when facing a villain alone,"},{"py":"huì gèng wēi xiǎn。","en":"makes things more dangerous."},{"py":"tā zhī dào。","en":"She knows."},{"py":"kě shì， shuō dào zhè jiàn shì，","en":"But when she talks about it,"},{"py":"tā de yǎn jing huì liàng qǐ lái。","en":"her eyes light up."}]},{"type":"reaction","actor":"YoungAlden","emotion":"curious","scene":"restaurant"},{"type":"reaction","actor":"Hannah","emotion":"excited","scene":"restaurant"},{"type":"line","speaker":"Hannah","scene":"restaurant","phrases":[{"py":"liǎng gè rén yì qǐ dǎ，","en":"Two people fighting together"},{"py":"dāng rán hěn hǎo。","en":"is great, of course."},{"py":"kě shì， rú guǒ yí gè rén de néng lì，","en":"But what if one person’s powers"},{"py":"zhèng hǎo néng bāng shàng lìng wài yí gè rén ne？","en":"are just right for helping the other?"}]},{"type":"line","speaker":"Hannah","scene":"restaurant","phrases":[{"py":"nà jiù bú shì liǎng gè rén jiā qǐ lái nà me jiǎn dān le。","en":"Then it isn’t as simple as adding two people together."},{"py":"nǐ men yì qǐ néng zuò dào de，","en":"What you can achieve together"},{"py":"huì bǐ liǎng gè rén fēn kāi zuò，","en":"compared with what you could do separately,"},{"py":"duō de duō！","en":"is so much more!"}]},{"type":"reaction","actor":"Alden","emotion":"determined","scene":"train"},{"type":"line","speaker":"Alden","scene":"train","phrases":[{"py":"wǒ kàn wài miàn de fáng zi。","en":"I look at the buildings outside."},{"py":"tā shuō de “ gèng hǎo ”，","en":"Her idea of “better”"},{"py":"bù zhǐ shì zài duō jiù yí gè rén。","en":"isn’t just saving one more person."},{"py":"yě kě néng shì，","en":"It might also mean"},{"py":"ràng lìng wài yí gè rén bú yòng shén me dōu zì jǐ zuò。","en":"making sure someone else doesn’t have to do everything alone."}]},{"type":"animation","id":"train-reflection"},{"type":"end"}],"cast":["Alden","YoungAlden","Hannah"],"art":["opening","closing","Alden-sad","Alden-thoughtful","YoungAlden-curious","Hannah-warm","YoungAlden-worried","Hannah-worried","Hannah-sad","Hannah-determined","YoungAlden-thoughtful","YoungAlden-confused","Hannah-excited","Alden-determined"],"chinese":false,"textVersion":"73281f5e8202"},{"format":1,"id":"supportive-12","version":"c2750cad4181","title":"The Nice One","shortTitle":"The Nice One","number":12,"sources":[{"title":"Super Supportive — Sleyca","url":"https://www.royalroad.com/fiction/63759/super-supportive","note":"User-supplied EPUB, closing conversation of FIVE: The Nice One. Simplified Mandarin with local expressive choices."}],"notice":"This episode is a Mandarin learning adaptation of Super Supportive by Sleyca. Some wording and reflective choices have been adapted for language practice. Read the original novel for the author’s full story.","entry":0,"nodes":[{"type":"reaction","actor":"Alden","emotion":"thoughtful","scene":"train"},{"type":"line","speaker":"Alden","scene":"train","phrases":[{"py":"wǒ hái zài xiǎng hàn nà de shì，","en":"I'm still thinking about Hannah,"},{"py":"péng you yǐ jīng jiào wǒ xià chē le。","en":"when my friend calls me to get off."}]},{"type":"line","speaker":"Jeremy","scene":"train","phrases":[{"py":"wǒ men dào le！","en":"We're here!"},{"py":"nǐ zěn me le？","en":"What's up with you?"},{"py":"yì zhí zài xiǎng shén me？","en":"What have you been thinking about?"}]},{"type":"animation","id":"jeremy-train-listen"},{"type":"reaction","actor":"Alden","emotion":"thoughtful","scene":"train"},{"type":"line","speaker":"Alden","scene":"train","phrases":[{"py":"duì bù qǐ。","en":"Sorry."},{"py":"wǒ zài xiǎng","en":"I was thinking about"},{"py":"xué xiào ràng wǒ men xiě de dōng xi。","en":"the writing we have to do for school."}]},{"type":"choice","id":"school","options":[{"id":"sorry","phrases":[{"py":"duì bù qǐ，","en":"Sorry,"},{"py":"gāng cái méi tīng dào。","en":"I didn't hear you just now."}],"to":7},{"id":"thinking","phrases":[{"py":"wǒ hái méi xiǎng hǎo","en":"I haven't figured out"},{"py":"zěn me xiě。","en":"how to write it yet."}],"to":9}]},{"type":"line","speaker":"Jeremy","scene":"train","phrases":[{"py":"nǐ shì bu shì","en":"Do you"},{"py":"tài xǐ huan xué xiào le？","en":"like school a little too much?"}]},{"type":"goto","to":10},{"type":"line","speaker":"Jeremy","scene":"train","phrases":[{"py":"jīn tiān yě yào xiǎng","en":"Do you have to think about"},{"py":"xué xiào de shì ma？","en":"school even today?"}]},{"type":"line","speaker":"Jeremy","scene":"train","phrases":[{"py":"wǒ wèi shén me yào gēn nǐ men yì qǐ wán？","en":"Why do I hang out with you two?"},{"py":"yí gè xīng qī yǐ jīng shàng wǔ tiān xué le，","en":"We already go to school five days a week,"},{"py":"xiàn zài hái yào duō shàng liǎng tiān！","en":"and now we have two more!"}]},{"type":"line","speaker":"Boe","scene":"train","phrases":[{"py":"wǒ men jiào nǐ yì qǐ lái de shí hou，","en":"When we asked you to come along,"},{"py":"méi xiǎng dào nǐ zhēn de huì lái。","en":"we didn't think you'd actually come."}]},{"type":"line","speaker":"Boe","scene":"train","phrases":[{"py":"nǐ xiàn zài xiǎng zuò shén me dōu kě yǐ，","en":"You could be doing anything,"},{"py":"què gēn wǒ men yì qǐ shàng kè。","en":"but you're taking classes with us."},{"py":"wǒ yīng gāi hěn kāi xīn，","en":"Should I be happy,"},{"py":"hái shì yīng gāi dān xīn","en":"or worried"},{"py":"nǐ méi yǒu qí tā péng you？","en":"that you don't have other friends?"}]},{"type":"animation","id":"boe-train-think"},{"type":"choice","id":"teasing","options":[{"id":"need","phrases":[{"py":"nǐ zhè me xū yào wǒ men a？","en":"You need us that much?"}],"to":15},{"id":"student","phrases":[{"py":"nǐ yào biàn chéng","en":"You're going to become"},{"py":"hǎo xué shēng le。","en":"a good student."}],"to":19}]},{"type":"reaction","actor":"Alden","emotion":"thoughtful","scene":"train"},{"type":"line","speaker":"Alden","scene":"train","phrases":[{"py":"wǒ men yǐ qián hái bù zhī dào，","en":"We never knew"},{"py":"nǐ zhè me xū yào wǒ men。","en":"you needed us this much."}]},{"type":"line","speaker":"Jeremy","scene":"train","phrases":[{"py":"nǐ yě zhè me shuō？","en":"You're saying that too?"},{"py":"nǐ zěn me néng gēn tā yì qǐ shuō wǒ！","en":"How can you join him in picking on me!"}]},{"type":"goto","to":21},{"type":"line","speaker":"Alden","scene":"train","phrases":[{"py":"zhè yàng xià qù，","en":"At this rate,"},{"py":"nǐ bù xiǎng zuò gè hǎo xué shēng，","en":"even if you don't want to be a good student,"},{"py":"yě bù xíng le。","en":"you won't have a choice."}]},{"type":"line","speaker":"Jeremy","scene":"train","phrases":[{"py":"nǐ zěn me néng shuō zhè zhǒng huà！","en":"How can you say something like that!"}]},{"type":"line","speaker":"Alden","scene":"train","phrases":[{"py":"wǒ ná zhe bāo，","en":"I take my bag"},{"py":"zhàn qǐ lái。","en":"and stand up."},{"py":"tā kàn wǒ de yàng zi，","en":"The way he looks at me,"},{"py":"hǎo xiàng wǒ gāng cái shuō le","en":"it's as if I've just said"},{"py":"shén me kě pà de huà。","en":"something terrible."}]},{"type":"line","speaker":"Jeremy","scene":"train","phrases":[{"py":"nǐ zhè ge gěi è mó sòng chī de jiā huo！","en":"You demon-feeding jerk!"},{"py":"nǐ bú shì wǒ men sān gè rén lǐ de hǎo rén ma？","en":"Aren't you supposed to be the nice one of us three?"}]},{"type":"animation","id":"jeremy-train-think"},{"type":"reaction","actor":"Alden","emotion":"thoughtful","scene":"train"},{"type":"line","speaker":"Alden","scene":"train","phrases":[{"py":"shì ma？","en":"Am I?"},{"py":"wǒ hái zhēn bù zhī dào。","en":"I honestly didn't know."}]},{"type":"line","speaker":"Alden","scene":"train","phrases":[{"py":"wǒ bú shì zài kāi wán xiào。","en":"I'm not joking."},{"py":"wǒ méi xiǎng dào，","en":"I didn't expect"},{"py":"tā huì zhè yàng shuō wǒ。","en":"him to say that about me."}]},{"type":"animation","id":"train-reflection"},{"type":"reaction","actor":"Alden","emotion":"thoughtful","scene":"street"},{"type":"line","speaker":"Alden","scene":"street","phrases":[{"py":"wǒ men xià chē，","en":"We get off the train,"},{"py":"yì qǐ zǒu xià lóu，","en":"head downstairs together,"},{"py":"lái dào wài miàn de lù shang。","en":"and reach the street outside."}]},{"type":"reaction","actor":"Alden","emotion":"thoughtful","scene":"street"},{"type":"line","speaker":"Alden","scene":"street","phrases":[{"py":"wǒ xiǎng，","en":"I guess"},{"py":"wǒ shuō huà shì méi yǒu nǐ nà me nán tīng。","en":"I'm not as mean as you when I talk."}]},{"type":"line","speaker":"Boe","scene":"street","phrases":[{"py":"nà shì yīn wèi","en":"That's because"},{"py":"nǐ hái bú tài nǔ lì。","en":"you aren't trying hard enough yet."}]},{"type":"line","speaker":"Jeremy","scene":"street","phrases":[{"py":"nǐ men liǎng gè bié shuō le！","en":"Shut up, you two!"},{"py":"wǒ shì hǎo xiào de nà ge，","en":"I'm the funny one,"},{"py":"bó shì shuō huà nán tīng de nà ge，","en":"Boe's the mean one,"},{"py":"nǐ shì hǎo rén。","en":"and you're the nice one."}]},{"type":"line","speaker":"Boe","scene":"street","phrases":[{"py":"yuán lái nǐ yǐ jīng gěi wǒ men fēn hǎo le？","en":"So you've already sorted us all out?"},{"py":"néng bu néng shuō","en":"Couldn't you say"},{"py":"wǒ shuō huà hěn lì hai？","en":"I have a sharp way with words?"}]},{"type":"choice","id":"labels","options":[{"id":"laugh","phrases":[{"py":"tīng qǐ lái，","en":"It sounds like"},{"py":"tā hěn rèn zhēn。","en":"he's serious."}],"to":36},{"id":"compare","phrases":[{"py":"wǒ yǒu nà me hǎo ma？","en":"Am I really that nice?"}],"to":38}]},{"type":"line","speaker":"Alden","scene":"street","phrases":[{"py":"wǒ yǐ wéi wǒ men zhǐ shì zài kāi wán xiào。","en":"I thought we were just joking."},{"py":"tā què zhēn de xiǎng guo，","en":"But he's actually thought about"},{"py":"wǒ men měi gè rén shì shén me yàng de rén。","en":"what each of us is like."}]},{"type":"goto","to":39},{"type":"line","speaker":"Alden","scene":"street","phrases":[{"py":"wǒ hěn shǎo huì zhè yàng xiǎng zì jǐ。","en":"I rarely think of myself that way."},{"py":"kě shì， tā shuō de nà me qīng chu，","en":"But he says it so clearly,"},{"py":"hǎo xiàng zǎo jiù zhī dào le。","en":"as if he's known all along."}]},{"type":"reaction","actor":"Alden","emotion":"thoughtful","scene":"street"},{"type":"line","speaker":"Alden","scene":"street","phrases":[{"py":"wǒ bú shì jiàn le shuí dōu xiǎng shuō huà。","en":"I don't want to talk to everyone I meet."},{"py":"zì jǐ yí gè rén zuò zì jǐ de shì，","en":"Doing my own thing alone,"},{"py":"wǒ yě hěn shū fu。","en":"I'm perfectly comfortable too."}]},{"type":"line","speaker":"Alden","scene":"street","phrases":[{"py":"yǐ qián zài xué xiào，","en":"Back at school,"},{"py":"bó gēn tóng xué shuō huà，","en":"when Boe talked to our classmates,"},{"py":"zǒng shì ràng tā men bù gāo xìng。","en":"he always upset them."},{"py":"zhǐ yǒu wǒ méi yǒu shēng qì。","en":"I was the only one who wasn't angry."}]},{"type":"line","speaker":"Alden","scene":"street","phrases":[{"py":"hòu lái，","en":"Then"},{"py":"tā jiù kāi shǐ gēn wǒ yì qǐ wán。","en":"he started hanging out with me."},{"py":"zài hòu lái，","en":"Later,"},{"py":"jié lǐ mǐ yě gēn wǒ men yì qǐ wán le。","en":"Jeremy joined us too."}]},{"type":"reaction","actor":"Alden","emotion":"thoughtful","scene":"street"},{"type":"line","speaker":"Alden","scene":"street","phrases":[{"py":"nǐ jué de wǒ hǎo，","en":"You think I'm nice,"},{"py":"wǒ hěn gāo xìng。","en":"and I'm glad."},{"py":"kě shì， wèi shén me？","en":"But why?"}]},{"type":"line","speaker":"Jeremy","scene":"street","phrases":[{"py":"yīn wèi nǐ xiǎng chéng wéi yīng xióng a！","en":"Because you want to be a superhero!"}]},{"type":"line","speaker":"Jeremy","scene":"street","phrases":[{"py":"nǐ zuò shì hěn rèn zhēn，","en":"You're so sensible."},{"py":"yǐ hòu shàng dà xué yào zuò shén me，","en":"About what to do for college,"},{"py":"nǐ dōu yǐ jīng xiě le hěn duō。","en":"you've already written loads."}]},{"type":"line","speaker":"Jeremy","scene":"street","phrases":[{"py":"kě shì， nǐ hái shì xiǎng chuān shàng nà zhǒng yī fu，","en":"But you still want to put on that outfit"},{"py":"qù bǎ shù shàng de xiǎo māo jiù xià lái。","en":"and rescue kittens from trees."}]},{"type":"line","speaker":"Jeremy","scene":"street","phrases":[{"py":"wǒ yě bù zhī dào zěn me shuō。","en":"I don't know how to say it."},{"py":"jiù shì … …","en":"It's just..."},{"py":"nǐ zhè yàng， zhēn de hěn hǎo。","en":"you're really sweet that way."}]},{"type":"animation","id":"jeremy-street-listen"},{"type":"line","speaker":"Alden","scene":"street","phrases":[{"py":"wǒ bù zhī dào gāi shuō shén me。","en":"I don't know what to say."},{"py":"zhè jiàn shì，","en":"That thing—"},{"py":"tā jiù zhè yàng shuō le。","en":"he's just said it out loud."}]},{"type":"choice","id":"dream","options":[{"id":"plan","phrases":[{"py":"xiǎng xiang","en":"Think about"},{"py":"xiě hǎo de nà xiē dō
