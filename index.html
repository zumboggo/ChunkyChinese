<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="%BASE_URL%icons/icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0ea5e9" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Chunky" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="Private offline Chinese vocabulary audio lessons."
    />
    <title>Chunky Chinese</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        async function resetChunkyPwaShell() {
          const registrations = await navigator.serviceWorker.getRegistrations()
          await Promise.all(registrations.map((registration) => registration.unregister()))
          if ('caches' in window) {
            const keys = await caches.keys()
            await Promise.all(
              keys
                .filter((key) => key.indexOf('chunky-chinese-') === 0)
                .map((key) => caches.delete(key)),
            )
          }
          const cleanUrl = new URL(window.location.href)
          cleanUrl.searchParams.delete('resetPwa')
          cleanUrl.searchParams.set('fresh', String(Date.now()))
          window.location.replace(cleanUrl.toString())
        }

        if (new URL(window.location.href).searchParams.get('resetPwa') === '1') {
          resetChunkyPwaShell().catch((error) => {
            console.warn('Chunky Chinese PWA reset failed.', error)
          })
        }

        window.addEventListener('load', async () => {
          try {
            const registration = await navigator.serviceWorker.register('./service-worker.js', {
              updateViaCache: 'none',
            })
            registration.addEventListener('updatefound', () => {
              const worker = registration.installing
              if (!worker) return
              worker.addEventListener('statechange', () => {
                if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                  worker.postMessage({ type: 'SKIP_WAITING' })
                }
              })
            })
            await registration.update()
            // Let a waiting worker take over on the next normal navigation so an
            // active study session is never interrupted by an update reload.
          } catch (error) {
            console.warn('Chunky Chinese service worker registration failed.', error)
          }
        })
      }
    </script>
  </body>
</html>
